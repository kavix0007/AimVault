<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AimVault Admin Login</title><link rel="stylesheet" href="/assets/css/pages.css"><style>body{min-height:100vh;display:grid;place-items:center}.login{width:min(430px,calc(100% - 30px));padding:28px}.login h1{margin:0 0 8px}.login p{color:var(--dim);font:12px Inter;line-height:1.6}.field{display:grid;gap:7px;margin:16px 0}.field label{font:700 10px Inter;color:var(--dim2);text-transform:uppercase}.field input{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:12px;color:var(--text);font:13px Inter}.error{color:#ff6b75;font:11px Inter;min-height:18px}</style></head><body><div class="panel login"><div class="eyebrow">AimVault</div><h1>Admin login</h1><p>Private dashboard for adding and managing crosshairs.</p><form id="login"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><div class="error" id="error"></div><button class="btn" type="submit">Sign in</button></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/supabase-config.js"></script><script>const c=window.supabase?.createClient(AIMVAULT_SUPABASE.url,AIMVAULT_SUPABASE.anonKey);document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const er=document.getElementById('error');er.textContent='Signing in…';const {data,error}=await c.auth.signInWithPassword({email:email.value,password:password.value});if(error){er.textContent=error.message;return}const a=await c.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(a.error||!a.data){await c.auth.signOut();er.textContent='This account is not an AimVault admin.';return}location.href='/admin/';});</script></body></html>
