<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AimVault Admin</title><link rel="stylesheet" href="/assets/css/pages.css"><style>.admin-wrap{max-width:1100px;margin:0 auto;padding:32px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.top h1{margin:0}.form{padding:22px;margin-bottom:22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font:700 10px Inter;color:var(--dim2);text-transform:uppercase}.field input,.field textarea{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:11px;color:var(--text);font:12px Inter}.field textarea{min-height:100px;resize:vertical}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:6px;font:11px Inter;color:var(--dim)}.actions{display:flex;gap:8px;margin-top:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--border-soft);font:11px Inter}.table th{color:var(--dim2);font-size:9px}.status{font-size:10px}.ok{color:#7fe0a2}.muted{color:var(--dim)}.thumb{width:52px;height:36px;object-fit:contain;background:#080c12;border-radius:4px}.danger{border-color:#6d2730!important;color:#ff7b84!important}@media(max-width:700px){.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.table{font-size:10px}.hide-mobile{display:none}}</style></head><body><header><div class="wrap nav"><a class="logo" href="/"><span class="logo-mark">⌾</span>Aim<em>Vault</em></a><nav class="navlinks"><a href="/">Site</a><a href="/crosshair-codes/">Crosshairs</a></nav></div></header><main class="admin-wrap"><div class="top"><div><div class="eyebrow">Control panel</div><h1>Crosshair Manager</h1></div><button id="logout" class="btn btn-dark">Sign out</button></div><div class="panel form"><h2 id="formTitle">Add crosshair</h2><form id="form"><input type="hidden" id="id"><div class="fields"><div class="field"><label>Name</label><input id="name" required></div><div class="field"><label>Player (optional)</label><input id="player"></div><div class="field full"><label>Valorant code</label><textarea id="code" required></textarea></div><div class="field full"><label>Image upload</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small class="muted">Uploads go to Supabase Storage.</small></div><div class="field full"><label>Categories</label><div class="checks" id="cats"></div></div><div class="field"><label>Tags (comma separated)</label><input id="tags" placeholder="aim, clean, one-tap"></div><div class="field"><label>Options</label><div class="checks"><label><input id="isPro" type="checkbox"> Pro</label><label><input id="published" type="checkbox" checked> Published</label></div></div></div><div class="actions"><button class="btn" type="submit">Save crosshair</button><button class="btn btn-dark" type="button" id="cancel" style="display:none">Cancel edit</button></div><div class="error" id="error"></div></form></div><div class="panel" style="padding:20px"><div class="top"><div><h2>All crosshairs</h2><p class="muted">Database is the single source of truth. No copy counter is stored.</p></div><input id="search" placeholder="Search…" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px;border-radius:6px"></div><div style="overflow:auto"><table class="table"><thead><tr><th>Preview</th><th>Name</th><th>Categories</th><th>Pro</th><th>Published</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/supabase-config.js"></script><script>
const sb=supabase.createClient(AIMVAULT_SUPABASE.url,AIMVAULT_SUPABASE.anonKey);const cats=['pro','dot','cyan','small','funny','minimalist','teams','other'];let rows=[];let editing=null;
const $=id=>document.getElementById(id);const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)};
$('cats').innerHTML=cats.map(x=>`<label><input type="checkbox" value="${x}"> ${x[0].toUpperCase()+x.slice(1)}</label>`).join('');
async function guard(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='/admin/login/';return null}const {data}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(!data){await sb.auth.signOut();location.href='/admin/login/';return null}return user}
async function load(){const u=await guard();if(!u)return;const {data,error}=await sb.from('crosshairs').select('*').order('created_at',{ascending:false});if(error){$('error').textContent=error.message;return}rows=data||[];render()}
function render(){const q=$('search').value.toLowerCase();$('rows').innerHTML=rows.filter(x=>(x.name+' '+(x.player||'')+' '+(x.categories||[]).join(' ')).toLowerCase().includes(q)).map(x=>`<tr><td><img class="thumb" src="${x.image_url||'/default.webp'}"></td><td><strong>${esc(x.name)}</strong><br><span class="muted">${esc(x.player||'')}</span></td><td>${esc((x.categories||[]).join(', '))}</td><td>${x.is_pro?'YES':'—'}</td><td class="status ${x.published?'ok':'muted'}">${x.published?'LIVE':'DRAFT'}</td><td><button class="btn btn-dark" onclick="editRow('${x.id}')">Edit</button> <button class="btn btn-dark danger" onclick="deleteRow('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No crosshairs.</td></tr>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function reset(){editing=null;$('id').value='';$('formTitle').textContent='Add crosshair';$('form').reset();$('published').checked=true;$('cancel').style.display='none';document.querySelectorAll('#cats input').forEach(x=>x.checked=false);$('error').textContent=''}
window.editRow=id=>{const x=rows.find(r=>r.id===id);if(!x)return;editing=x;$('id').value=x.id;$('name').value=x.name;$('player').value=x.player||'';$('code').value=x.code;$('tags').value=(x.tags||[]).join(', ');$('isPro').checked=x.is_pro;$('published').checked=x.published;document.querySelectorAll('#cats input').forEach(c=>c.checked=(x.categories||[]).includes(c.value));$('formTitle').textContent='Edit crosshair';$('cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}
window.deleteRow=async id=>{if(!confirm('Delete this crosshair?'))return;const {error}=await sb.from('crosshairs').delete().eq('id',id);if(error){alert(error.message);return}toast('Deleted');await load()}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='Saving…';try{let image_url=editing?.image_url||null;const file=$('image').files[0];if(file){const ext=(file.name.split('.').pop()||'webp').toLowerCase();const path=crypto.randomUUID()+'.'+ext;const up=await sb.storage.from('crosshair-images').upload(path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error;image_url=sb.storage.from('crosshair-images').getPublicUrl(path).data.publicUrl}const payload={name:$('name').value.trim(),player:$('player').value.trim()||null,code:$('code').value.trim(),image_url,categories:[...document.querySelectorAll('#cats input:checked')].map(x=>x.value),tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),is_pro:$('isPro').checked,published:$('published').checked};let r=editing?await sb.from('crosshairs').update(payload).eq('id',editing.id):await sb.from('crosshairs').insert(payload);if(r.error)throw r.error;toast(editing?'Updated':'Added');reset();await load()}catch(err){console.error(err);$('error').textContent=err.message||String(err)}});$('cancel').onclick=reset;$('search').addEventListener('input',render);$('logout').onclick=async()=>{await sb.auth.signOut();location.href='/admin/login/'};load();</script></body></html>
